name: Deploy MailHub Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.ts"
      - "wrangler.jsonc"
      - "src/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailhub-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm network retries
        run: |
          npm config set fetch-retries 3
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
          npm config set fetch-timeout 120000

      - name: Install dependencies
        timeout-minutes: 10
        run: npm install --no-audit --no-fund --legacy-peer-deps --fetch-retries=3 --fetch-timeout=120000

      - name: Build OpenNext Worker
        timeout-minutes: 10
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: ""
          NEXT_PUBLIC_SITE_URL: ""
        run: npm run build:worker

      - name: Inject Auth Secrets
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: "39fba5c84e10f7f4c1cceab74dd9ec95"
          AUTH_SECRET_VAL: ${{ secrets.AUTH_SECRET_VALUE }}
          GITHUB_CLIENT_ID_VAL: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET_VAL: ${{ secrets.GITHUB_CLIENT_SECRET }}
        run: |
          set -e
          test -n "$AUTH_SECRET_VAL" || (echo "::error::Missing repository secret AUTH_SECRET_VALUE."; exit 1)
          test -n "$GITHUB_CLIENT_ID_VAL" || (echo "::error::Missing repository secret GITHUB_CLIENT_ID."; exit 1)
          test -n "$GITHUB_CLIENT_SECRET_VAL" || (echo "::error::Missing repository secret GITHUB_CLIENT_SECRET."; exit 1)
          test -n "$CLOUDFLARE_API_KEY" || (echo "::error::Missing repository secret CF_API_KEY."; exit 1)
          test -n "$CLOUDFLARE_EMAIL" || (echo "::error::Missing repository secret CF_EMAIL."; exit 1)
          node -e "console.log(JSON.stringify({AUTH_SECRET: process.env.AUTH_SECRET_VAL, NEXTAUTH_SECRET: process.env.AUTH_SECRET_VAL, AUTH_GITHUB_ID: process.env.GITHUB_CLIENT_ID_VAL, AUTH_GITHUB_SECRET: process.env.GITHUB_CLIENT_SECRET_VAL, GITHUB_CLIENT_ID: process.env.GITHUB_CLIENT_ID_VAL, GITHUB_CLIENT_SECRET: process.env.GITHUB_CLIENT_SECRET_VAL}))" | npx wrangler secret bulk --name mailhub

      - name: Verify Auth Secrets
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: "39fba5c84e10f7f4c1cceab74dd9ec95"
        run: |
          set -e
          npx wrangler secret list --name mailhub > /tmp/secrets.txt
          cat /tmp/secrets.txt
          if ! grep -Eq '"name"[[:space:]]*:[[:space:]]*"AUTH_SECRET"' /tmp/secrets.txt; then
            echo "::error::AUTH_SECRET missing"
            exit 1
          fi
          if ! grep -Eq '"name"[[:space:]]*:[[:space:]]*"NEXTAUTH_SECRET"' /tmp/secrets.txt; then
            echo "::error::NEXTAUTH_SECRET missing"
            exit 1
          fi
          echo "Verified: AUTH_SECRET and NEXTAUTH_SECRET are present."

      - name: Deploy to Cloudflare production
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: "39fba5c84e10f7f4c1cceab74dd9ec95"
        run: |
          test -n "$CLOUDFLARE_API_KEY" || (echo "::error::Missing repository secret CF_API_KEY."; exit 1)
          test -n "$CLOUDFLARE_EMAIL" || (echo "::error::Missing repository secret CF_EMAIL."; exit 1)
          npx wrangler deploy --keep-vars
